name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install stellar CLI
        run: |
          curl -sL https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv stellar /usr/local/bin/stellar

      # orbit-factory imports a compiled wasm of orbit-contract via
      # contractimport! (see orbit-factory/src/lib.rs) — it won't build
      # (tests included) until this artifact exists.
      - name: Build orbit-contract wasm
        run: cargo build --target wasm32v1-none --release -p orbit-contract

      - name: Optimize orbit-contract wasm
        run: stellar contract optimize --wasm target/wasm32v1-none/release/orbit_contract.wasm

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
